name: tdg_vm_wr_config.yml
description: reach-safety tasks for tdg_vm_wr
tasks:

  - name: tdg_vm_wr__expected__safety_requirement
    target:
      filename: formal/harness/tdg_vm_wr_harness.c
      method: tdg_vm_wr__call
    before_target:
      - filename: formal/src/initialization.c
        method: init_tdg_vm_xxx
      - filename: formal/harness/tdg_vm_wr_harness.c
        method: tdg_vm_wr__expected__precond
    after_target:
      - filename: formal/harness/tdg_vm_wr_harness.c
        method: tdg_vm_wr__expected__postcond
      - filename: formal/src/initialization.c
        method: close_tdg_vm_xxx_with_check
    properties:
      - property_file: ../../../properties/unreach-call.prp
        expected_verdict: true
      - property_file: ../../../properties/coverage-error-call.prp
        expected_verdict: true

