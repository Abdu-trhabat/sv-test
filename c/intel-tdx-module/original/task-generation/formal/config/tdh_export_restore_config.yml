name: tdh_export_restore_config.yml
description: reach-safety tasks for tdh_export_restore
tasks:

  - name: tdh_export_restore__expected__safety_requirement
    target:
      filename: formal/harness/tdh_export_restore_harness.c
      method: tdh_export_restore__call
    before_target:
      - filename: formal/src/initialization.c
        method: init_tdh_export_xxx
      - filename: formal/harness/tdh_export_restore_harness.c
        method: tdh_export_restore__expected__precond
    after_target:
      - filename: formal/harness/tdh_export_restore_harness.c
        method: tdh_export_restore__expected__postcond
      - filename: formal/src/initialization.c
        method: close_tdh_export_xxx_with_check
    properties:
      - property_file: ../../../properties/unreach-call.prp
        expected_verdict: true
      - property_file: ../../../properties/coverage-error-call.prp
        expected_verdict: true

  - name: tdh_export_restore__expected__cover_entry
    target:
      filename: formal/harness/tdh_export_restore_harness.c
      method: tdh_export_restore__call
    before_target:
      - filename: formal/src/initialization.c
