      - filename: formal/harness/tdh_export_restore_harness.c
        method: tdh_export_restore__expected__precond
      - filename: formal/harness/common.c
        method: insert_cover_point
    after_target:
#       - filename: formal/harness/tdh_export_restore_harness.c
#         method: tdh_export_restore__expected__postcond
      - filename: formal/src/initialization.c
