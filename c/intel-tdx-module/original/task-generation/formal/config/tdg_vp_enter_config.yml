name: tdg_vp_enter_config.yml
description: reach-safety tasks for tdg_vp_enter
tasks:

  - name: tdg_vp_enter__expected__safety_requirement
    target:
      filename: formal/harness/tdg_vp_enter_harness.c
      method: tdg_vp_enter__call
    before_target:
      - filename: formal/src/initialization.c
        method: init_tdg_vp_xxx
      - filename: formal/harness/tdg_vp_enter_harness.c
        method: tdg_vp_enter__expected__precond
    after_target:
      - filename: formal/harness/tdg_vp_enter_harness.c
        method: tdg_vp_enter__expected__postcond
      - filename: formal/src/initialization.c
        method: close_tdg_vp_xxx_with_check
    properties:
      - property_file: ../../../properties/unreach-call.prp
        expected_verdict: true
      - property_file: ../../../properties/coverage-error-call.prp
