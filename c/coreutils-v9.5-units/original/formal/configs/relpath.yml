name: relpath
description: tasks that verify functionality of path common prefix computation
tasks:
  - name: relpath_path_common_prefix_symmetry_functional
    before_target:
      - filename: formal/harnesses/relpath-harness.c
        method: init_buffers_large
      - filename: formal/harnesses/relpath-harness.c
        method: init_input_paths
    target:
      filename: formal/harnesses/relpath-harness.c
      method: call_path_common_prefix
    after_target:
      - filename: formal/harnesses/relpath-harness.c
        method: postcond_path_common_prefix_symmetric
      - filename: formal/harnesses/relpath-harness.c
        method: free_buffers
    properties:
      - property_file: ../../properties/unreach-call.prp
        expected_verdict: true
      - property_file: ../../properties/valid-memsafety.prp
        expected_verdict: true
      - property_file: ../../properties/coverage-branches.prp

  - name: relpath_path_common_prefix_symmetry_cover_target
    before_target:
      - filename: formal/harnesses/relpath-harness.c
        method: init_buffers_large
      - filename: formal/harnesses/relpath-harness.c
        method: init_input_paths
    target:
      filename: formal/harnesses/relpath-harness.c
      method: call_path_common_prefix
    after_target:
      - filename: formal/harnesses/cover-check.c
        method: cover_check
    properties:
      - property_file: ../../properties/unreach-call.prp
        expected_verdict: false
      - property_file: ../../properties/valid-memsafety.prp
        expected_verdict: true
      - property_file: ../../properties/coverage-error-call.prp
      - property_file: ../../properties/coverage-branches.prp

